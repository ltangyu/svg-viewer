<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100">
  <rect x="0" y="0" width="300" height="100" fill="#ffffff" stroke="#000" stroke-width="1" />
  <circle cx="30" cy="50" r="14" fill="#000">
    <animate attributeName="cx"
             from="30" to="270"
             dur="2s"
             repeatCount="indefinite"
             values="30; 270; 30"
             keyTimes="0; 0.5; 1" />
  </circle>
  <text x="150" y="92" font-family="Inter, sans-serif" font-size="9" fill="#6b6b6b" text-anchor="middle">
    SMIL animate cx
  </text>
</svg>
