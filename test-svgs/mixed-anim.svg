<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <style>
    .css-rect {
      transform-origin: 60px 60px;
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50%      { transform: scale(1.3); opacity: 0.5; }
    }
  </style>
  <!-- SMIL circle -->
  <circle cx="50" cy="150" r="14" fill="#000">
    <animate attributeName="cx" from="50" to="250" dur="2s"
             repeatCount="indefinite" values="50; 250; 50" keyTimes="0; 0.5; 1" />
  </circle>
  <!-- CSS rect -->
  <rect class="css-rect" x="30" y="30" width="60" height="60" fill="#666" />
  <!-- JS-driven text -->
  <text id="tick" x="220" y="50" font-family="Inter, sans-serif" font-size="14"
        fill="#000" text-anchor="middle">0</text>
  <script>
  <![CDATA[
    var t = 0;
    setInterval(function() {
      t += 1;
      document.getElementById('tick').textContent = t.toString();
    }, 100);
  ]]>
  </script>
  <text x="150" y="190" font-family="Inter, sans-serif" font-size="10"
        fill="#6b6b6b" text-anchor="middle">SMIL + CSS + JS</text>
</svg>
